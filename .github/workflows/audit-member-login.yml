name: Audit Member Login
on:
  push:
    branches: [main]
    paths:
      - functions/audit-member-login.js
      - .github/workflows/audit-member-login.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Configure Firebase credentials
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          else
            echo "::error::Firebase service account secret is missing"
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Audit approved member login links
        run: node functions/audit-member-login.js
      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
