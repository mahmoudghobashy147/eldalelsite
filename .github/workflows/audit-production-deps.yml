name: Audit production dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-production-deps.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked web dependencies
        run: npm ci

      - name: Audit web production dependencies
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/web-audit.json" || true
          node - "$RUNNER_TEMP/web-audit.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const m = report.metadata?.vulnerabilities || {};
          console.log(`WEB_PROD_AUDIT total=${m.total||0} critical=${m.critical||0} high=${m.high||0} moderate=${m.moderate||0} low=${m.low||0}`);
          for (const [name, v] of Object.entries(report.vulnerabilities || {}).sort()) {
            if (!['critical','high'].includes(v.severity)) continue;
            const via = (v.via || []).map(x => typeof x === 'string' ? x : `${x.source}:${x.title}:${x.range}`).join(' | ');
            console.log(`WEB_VULN name=${name} severity=${v.severity} direct=${!!v.isDirect} range=${v.range} fix=${JSON.stringify(v.fixAvailable)} via=${via}`);
          }
          NODE

      - name: Install locked Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Audit Functions production dependencies
        shell: bash
        run: |
          cd functions
          npm audit --omit=dev --json > "$RUNNER_TEMP/functions-audit.json" || true
          node - "$RUNNER_TEMP/functions-audit.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const m = report.metadata?.vulnerabilities || {};
          console.log(`FUNCTIONS_PROD_AUDIT total=${m.total||0} critical=${m.critical||0} high=${m.high||0} moderate=${m.moderate||0} low=${m.low||0}`);
          for (const [name, v] of Object.entries(report.vulnerabilities || {}).sort()) {
            if (!['critical','high'].includes(v.severity)) continue;
            const via = (v.via || []).map(x => typeof x === 'string' ? x : `${x.source}:${x.title}:${x.range}`).join(' | ');
            console.log(`FUNCTIONS_VULN name=${name} severity=${v.severity} direct=${!!v.isDirect} range=${v.range} fix=${JSON.stringify(v.fixAvailable)} via=${via}`);
          }
          NODE
