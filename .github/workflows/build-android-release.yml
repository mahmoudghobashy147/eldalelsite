name: Build Android Release AAB

# نسخة Release الموقعة المخصصة لـ Google Play.
# يبني فرع الإصدار المخصص للاختبار ويمكن تشغيله يدويًا.
on:
  push:
    branches: [release/android-2.1.12]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unused version code greater than all uploaded versions'
        required: true
        type: number
      version_name:
        description: 'Version name shown on Google Play (for example 2.1.8)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        shell: bash
        run: |
          missing=0
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured in GitHub Actions secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Copy custom app icons
        run: cp -r android-icons/* android/app/src/main/res/

      - name: Add google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Add Google Services Gradle plugin
        run: |
          sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Google Play Billing native bridge
        run: node scripts/install-play-billing-native.cjs

      - name: Set Play release version
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code || '12' }}
          PLAY_VERSION_NAME: ${{ inputs.version_name || '2.1.12' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          code = os.environ["PLAY_VERSION_CODE"]
          name = os.environ["PLAY_VERSION_NAME"]
          if not re.fullmatch(r"[1-9][0-9]*", code) or not 7 < int(code) <= 2100000000:
              raise SystemExit("Use an unused version code greater than 7")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}", name):
              raise SystemExit("Use a numeric dotted version name")
          p = Path("android/app/build.gradle")
          s, a = re.subn(r"(?m)^(\s*versionCode\s+)\d+\s*$", lambda m: m[1] + code, p.read_text())
          s, b = re.subn(r'(?m)^(\s*versionName\s+)"[^"]+"\s*$', lambda m: m[1] + '"' + name + '"', s)
          if (a, b) != (1, 1):
              raise SystemExit("Missing Gradle version fields")
          p.write_text(s)
          PY

      - name: Decode Android signing keystore
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/release.keystore"

      - name: Build signed Release AAB
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify AAB signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: eldalel-elshamel-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"
