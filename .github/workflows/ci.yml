name: Verify web and Firebase functions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json في الجذر محتاج إعادة توليد قبل ما نقدر نعتمد npm ci بأمان.
      # بنستخدم نفس أسلوب build-apk الحالي مؤقتًا عشان الـ CI يختبر البناء الفعلي بدل ما يقف قبل الاختبار.
      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Check Functions syntax
        run: node --check functions/index.js
