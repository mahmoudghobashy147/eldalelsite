name: Verify web and Firebase functions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json في الجذر محتاج إعادة توليد قبل ما نقدر نعتمد npm ci بأمان.
      # بنستخدم نفس أسلوب build-apk الحالي مؤقتًا عشان الـ CI يختبر البناء الفعلي بدل ما يقف قبل الاختبار.
      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Check Functions syntax
        run: node --check functions/index.js

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Compile staged Firestore/Storage rules and execute behavioral authorization tests
      # against local emulators only. This never touches the production Firebase project.
      - name: Validate Firebase security rules behavior
        run: npx --yes firebase-tools@latest emulators:exec --project demo-daleel-rules --config firebase.rules-test.json --only firestore,storage "node scripts/test-firestore-rules.js && node scripts/test-storage-rules.js"
