name: Build cinematic ad preview
on:
  pull_request:
    branches: [main]
    paths:
      - src/AdsCarousel.jsx
      - src/ad-review-refinement.css
      - .github/workflows/cinematic-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-web-preview
          path: build
          if-no-files-found: error
          retention-days: 3
