name: Publish coordinated customer release
on:
  push:
    branches: [main]
    paths: [.github/customer-release-trigger.txt]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix functions
      - name: Configure release credentials
        shell: bash
        run: |
          umask 077
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/customer-firebase.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/customer-firebase.json"
          else
            echo '::error::Firebase deployment credential unavailable'
            exit 1
          fi
          node -e 'const f=require(process.argv[1]);if(f.project_id!=="eldalel-elshamel"||!f.private_key||!f.client_email)process.exit(1)' "$RUNNER_TEMP/customer-firebase.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/customer-firebase.json" >> "$GITHUB_ENV"
      - name: Review live rules and phone index without changing production
        run: |
          node scripts/review-live-rules.cjs
          node scripts/backfill-member-phone-index.cjs
          node scripts/stage-live-registration-rules.cjs
      - name: Validate additive rules and old-client compatibility
        run: npx firebase-tools emulators:exec --project demo-daleel-rules --config firebase.rules-test.json --only firestore,storage "node scripts/test-firestore-rules.js && node scripts/test-storage-rules.js && node scripts/test-catalog-rules.js"
      - name: Deploy only registration and gated billing functions
        run: npx firebase-tools deploy --project eldalel-elshamel --only functions:assertMemberPhoneAvailable,functions:completeMemberRegistration,functions:indexMemberPhone,functions:preparePlayPurchase,functions:verifyPlayPurchase,functions:playBillingNotifications,functions:reconcilePlayPurchases --non-interactive
      - name: Prepare private phone reservations without modifying member profiles
        run: node scripts/backfill-member-phone-index.cjs --execute
      - name: Publish additive Firestore rules only
        run: npx firebase-tools deploy --project eldalel-elshamel --only firestore:rules --non-interactive
      - name: Publish verified website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f build/CNAME
          grep -qx "eldalel-elshamel.online" build/CNAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          npx gh-pages -d build -m "Deploy customer and gated billing release ${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-release-rules-review
          path: |
            /tmp/production-firestore.rules
            /tmp/production-storage.rules
            firestore.rules
          if-no-files-found: ignore
      - name: Remove credential copy
        if: always()
        run: rm -f "$RUNNER_TEMP/customer-firebase.json"
