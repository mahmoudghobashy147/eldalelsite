name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/deploy-production-trigger.txt

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_PROJECT_ID: eldalel-elshamel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked web dependencies
        run: npm ci

      - name: Build and verify production website
        run: npm run build

      - name: Verify custom domain
        shell: bash
        run: |
          test -f build/CNAME
          grep -qx "eldalel-elshamel.online" build/CNAME

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Validate Functions syntax
        run: |
          node --check functions/index.js
          node --check functions/notification-triggers.js
          node --check functions/engagement-triggers.js
          node --check functions/service-requests.js
          node --check functions/member-interactions.js
          node --check functions/main.js

      - name: Configure Firebase credentials
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          else
            echo "::error::Configure FIREBASE_SERVICE_ACCOUNT_JSON (preferred) or FIREBASE_SERVICE_ACCOUNT_BASE64 in GitHub Actions secrets"
            exit 1
          fi
          node -e 'const f=require(process.argv[1]); if(f.project_id!=="eldalel-elshamel"||!f.private_key||!f.client_email) process.exit(1)' "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Cloud Functions first
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Re-test Firestore and Storage rules
        run: npx firebase-tools emulators:exec --project demo-daleel-rules --config firebase.rules-test.json --only firestore,storage "node scripts/test-firestore-rules.js && node scripts/test-storage-rules.js && node scripts/test-catalog-rules.js"

      - name: Deploy Firestore and Storage rules
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only firestore:rules,storage --non-interactive

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish website to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          npx gh-pages -d build -m "Deploy production ${GITHUB_SHA}"

      - name: Cleanup Firebase credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
