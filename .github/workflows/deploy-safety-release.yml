name: Deploy reviewed safety update only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/deploy-safety-trigger.txt]
permissions:
  contents: write
concurrency:
  group: eldalel-safety-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and build the reviewed site
        run: |
          npm ci
          npm run build
          npm ci --prefix functions
      - name: Test authentication, reports, blocking and post edits
        run: |
          npm run test:play-safety
          npx firebase-tools emulators:exec --project demo-daleel-rules --config firebase.rules-test.json --only firestore "node scripts/test-play-safety-emulator.cjs"
          test -f build/CNAME
          grep -qx 'eldalel-elshamel.online' build/CNAME
      - name: Use existing deployment credential
        shell: bash
        run: |
          umask 077
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          else
            echo '::error::Existing Firebase deployment credential is unavailable'
            exit 1
          fi
          node -e 'const f=require(process.argv[1]);if(f.project_id!=="eldalel-elshamel"||!f.private_key||!f.client_email)process.exit(1)' "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Refuse unreviewed production-rule drift
        run: node scripts/guard-safety-rules-deploy.cjs
      - name: Deploy only the eight new safety functions
        run: npx firebase-tools deploy --project eldalel-elshamel --only functions:submitSafetyReport,functions:setSafetyBlock,functions:getSafetyState,functions:getSafetyBlockStatus,functions:requestAccountDeletion,functions:sendSafetyMessage,functions:listSafetyModeration,functions:resolveSafetyReport --non-interactive
      - name: Verify safety endpoints reject unauthenticated requests
        run: node scripts/verify-live-safety-endpoints.cjs
      - name: Publish reviewed frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf 'https://github.com/'
          npx gh-pages -d build -m "Deploy reviewed safety update ${GITHUB_SHA}"
      - name: Close client message-write bypass and restrict post ownership edits
        run: npx firebase-tools deploy --project eldalel-elshamel --only firestore:rules --non-interactive
      - name: Remove credential copy
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
