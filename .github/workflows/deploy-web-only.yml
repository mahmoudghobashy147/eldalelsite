name: Deploy Web Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/deploy-web-only-trigger.txt

permissions:
  contents: write

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked web dependencies
        run: npm ci

      - name: Build and verify website
        run: npm run build

      - name: Verify custom domain
        shell: bash
        run: |
          test -f build/CNAME
          grep -qx "eldalel-elshamel.online" build/CNAME

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish website to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          npx gh-pages -d build -m "Deploy web-only ${GITHUB_SHA}"
