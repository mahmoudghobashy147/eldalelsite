name: Diagnose callable availability
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diagnose-callable-availability.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe invalid requests only
        shell: bash
        run: |
          for function in assertMemberPhoneAvailable completeMemberRegistration secureMemberLogin; do
            url="https://us-central1-eldalel-elshamel.cloudfunctions.net/$function"
            for origin in "https://eldalel-elshamel.online" "https://localhost"; do
              echo "ENDPOINT=$function ORIGIN=$origin"
              curl -sS --max-time 20 -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" \
                -X OPTIONS "$url" -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type'
              grep -Ei '^HTTP/|^access-control-allow-origin:' "$RUNNER_TEMP/headers" || true
              curl -sS --max-time 20 -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" \
                -X POST "$url" -H "Origin: $origin" -H 'Content-Type: application/json' --data '{"data":{}}'
              grep -Ei '^HTTP/|^access-control-allow-origin:' "$RUNNER_TEMP/headers" || true
              cat "$RUNNER_TEMP/body"
              echo
            done
          done

      - name: Check valid-format samples without creating accounts
        shell: bash
        run: |
          endpoint="https://us-central1-eldalel-elshamel.cloudfunctions.net/assertMemberPhoneAvailable"
          for sample in 01000000000 01100000000 01200000000; do
            curl -sS --max-time 20 -w ' HTTP %{http_code} time %{time_total}s\n' \
              -H 'Origin: https://eldalel-elshamel.online' -H 'Content-Type: application/json' \
              --data "{\"data\":{\"phone\":\"$sample\"}}" "$endpoint"
          done
