name: Materialize Marketplace Patches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-marketplace-patches.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply all safety and marketplace patches
        run: npm run patch:safety

      - name: Verify materialized source builds
        run: npm run build

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx firestore.rules scripts/test-firestore-rules.js scripts/apply-marketplace-home-patches.js
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 0
          fi
          git commit -m "Materialize marketplace platform changes"
          git push origin HEAD:main
