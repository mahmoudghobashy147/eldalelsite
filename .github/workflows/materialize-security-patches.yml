name: Materialize security patches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-security-patches.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply staged security patches to source files
        run: npm run patch:safety

      - name: Validate patch output
        run: git diff --check

      - name: Commit materialized patches
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx firestore.rules scripts/test-firestore-rules.js; then
            echo "No source patches to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx firestore.rules scripts/test-firestore-rules.js
          git commit -m "Materialize tested security patches"
          git push origin HEAD:main
