name: Migrate Public Contact Number

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-public-contact-number.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_PROJECT_ID: eldalel-elshamel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Configure Firebase credentials
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          else
            echo "::error::Firebase service account secret is missing"
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Update public contact number only
        run: node scripts/migrate-public-contact-number.js

      - name: Cleanup Firebase credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
