name: Enable verified Google Play checkout
on:
  push:
    branches: [ops/play-catalog-diagnostic]
    paths: [.github/workflows/play-catalog-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Verify active plans and enable checkout
        run: |
          node <<'JS'
          const {GoogleAuth,Impersonated}=require('./functions/node_modules/google-auth-library');
          const catalog=require('./functions/play-billing/catalog.json');
          const json=process.env.FIREBASE_SERVICE_ACCOUNT_JSON || Buffer.from(process.env.FIREBASE_SERVICE_ACCOUNT_BASE64 || '', 'base64').toString();
          const auth=new GoogleAuth({credentials:JSON.parse(json),scopes:['https://www.googleapis.com/auth/cloud-platform']});
          (async()=>{
            try {
              const deployer=await auth.getClient();
              const runtime='355717459859-compute@developer.gserviceaccount.com';
              console.log('Deployment and runtime identities match:',JSON.parse(json).client_email===runtime);
              const client=new Impersonated({sourceClient:deployer,targetPrincipal:runtime,targetScopes:['https://www.googleapis.com/auth/androidpublisher'],lifetime:300});
              const url='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/'+catalog.packageName+'/subscriptions';
              const plans=[];
              for(const product of catalog.products) {
                const basePlanId=product.basePlanId || catalog.basePlanId;
                const productUrl=url+'/'+product.id;
                const current=(await client.request({url:productUrl})).data.basePlans.find(p=>p.basePlanId===basePlanId);
                const eg=current?.regionalConfigs?.find(p=>p.regionCode==='EG');
                if(current?.autoRenewingBasePlanType?.billingPeriodDuration!==catalog.billingPeriod || eg?.newSubscriberAvailability!==true || eg?.price?.currencyCode!=='EGP' || Number(eg?.price?.units)!==product.price || Number(eg?.price?.nanos||0)!==0) throw Error('Plan validation failed '+product.id);
                plans.push({productUrl,basePlanId,current});
              }
              if(!plans.every(({current})=>current.state==='ACTIVE')) throw Error('Annual plans must be active');
              const admin=require('./functions/node_modules/firebase-admin');
              admin.initializeApp({credential:admin.credential.cert(JSON.parse(json)),projectId:'eldalel-elshamel'});
              const ref=admin.firestore().doc('config/playBilling');
              await ref.set({enabled:true},{merge:true});
              if((await ref.get()).data()?.enabled!==true) throw Error('Checkout flag readback failed');
              console.log('Verified Firebase Play checkout enabled');
            }catch(error){
              const data=error.response?.data?.error;
              console.error('Play API rejected catalog access',error.response?.status,data?.status,data?.message,error.message);
              process.exitCode=1;
            }
          })();
          JS
