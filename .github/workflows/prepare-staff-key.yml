name: Prepare limited staff access
on:
  push:
    branches: [feature/pending-phone-viewer]
    paths: [.github/workflows/prepare-staff-key.yml]
permissions:
  contents: read
jobs:
  public-key:
    runs-on: ubuntu-latest
    env:
      SERVICE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SERVICE_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
    steps:
      - name: Export public encryption key only
        shell: bash
        run: |
          node <<'NODE'
          const crypto=require('node:crypto');
          const raw=process.env.SERVICE_JSON||Buffer.from(process.env.SERVICE_BASE64||'','base64').toString();
          const service=JSON.parse(raw);
          if(service.project_id!=='eldalel-elshamel')throw Error('Unexpected project');
          console.log('STAFF_PUBLIC_KEY='+Buffer.from(crypto.createPublicKey(service.private_key).export({type:'spki',format:'pem'})).toString('base64'));
          NODE
