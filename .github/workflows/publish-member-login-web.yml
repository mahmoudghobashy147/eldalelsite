name: Publish Member Login Web Fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-member-login-web.yml
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify website
        run: npm run build

      - name: Verify custom domain
        run: |
          test -f build/CNAME
          grep -qx "eldalel-elshamel.online" build/CNAME

      - name: Publish website to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          npx gh-pages -d build -m "Publish member login web fix ${GITHUB_SHA}"
