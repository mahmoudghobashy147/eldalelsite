name: Publish registration rejection fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-registration-rejection.yml]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: eldalel-registration-rejection-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify website
        run: |
          npm ci
          npm run build
          npm ci --prefix functions
          grep -qx 'eldalel-elshamel.online' build/CNAME
      - name: Configure existing Firebase release credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          umask 077
          credential="$RUNNER_TEMP/registration-release.json"
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credential"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$credential"
          else
            echo '::error::Firebase release credential unavailable'
            exit 1
          fi
          node -e 'const f=require(process.argv[1]); if(f.project_id!=="eldalel-elshamel"||!f.private_key||!f.client_email)process.exit(1)' "$credential"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credential" >> "$GITHUB_ENV"
      - name: Apply only the rejection guard to current Firestore rules
        run: |
          node scripts/review-live-rules.cjs
          node <<'NODE'
          const fs = require('node:fs');
          const live = fs.readFileSync('/tmp/production-firestore.rules', 'utf8');
          const name = 'registrationWasRejected';
          if (live.includes(name)) {
            throw Error('Rejection guard already exists in production; review before replacing it.');
          }
          const start = live.indexOf('    match /members/{memberId} {');
          const end = live.indexOf('      match /reviews/', start);
          if (start < 0 || end < 0) throw Error('Live member rules anchors differ');
          const section = live.slice(start, end);
          const seen = new Set();
          const patched = section.replace(/^(\s*allow (create|update|delete): if )([\s\S]*?);/gm, (_, prefix, op, expression) => {
            if (seen.has(op)) throw Error('Unexpected duplicate member rule: ' + op);
            seen.add(op);
            return prefix + '!registrationWasRejected(memberId) && (' + expression + ');';
          });
          if (seen.size !== 3) throw Error('Missing live member write rules');
          const helper = '    function registrationWasRejected(memberId) {\n' +
            '      return exists(/databases/$(database)/documents/rejectedMemberRegistrations/$(memberId));\n' +
            '    }\n\n';
          fs.writeFileSync('firestore.rules', live.slice(0, start) + helper + patched + live.slice(end));
          NODE
      - name: Validate Firestore rules before releasing
        run: npx firebase-tools emulators:exec --project demo-daleel-rules --config firebase.rules-test.json --only firestore "node scripts/test-firestore-rules.js"
      - name: Deploy registration functions
        run: |
          set +e
          npx firebase-tools deploy --project eldalel-elshamel --only functions:adminRejectMemberRegistration,functions:completeMemberRegistration --non-interactive 2>&1 | tee "$RUNNER_TEMP/registration-functions.log"
          deploy_status=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_status" -ne 0 ]; then
            grep -q 'Functions successfully deployed but could not set up cleanup policy' "$RUNNER_TEMP/registration-functions.log"
          fi
      - name: Verify live rejection endpoint requires authentication
        run: |
          status="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/registration-response.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' --data '{"data":{}}' \
            https://us-central1-eldalel-elshamel.cloudfunctions.net/adminRejectMemberRegistration)"
          test "$status" = 401
          node -e 'if(JSON.parse(require("node:fs").readFileSync(process.argv[1])).error?.status!=="UNAUTHENTICATED") process.exit(1)' "$RUNNER_TEMP/registration-response.json"
      - name: Deploy updated Firestore rules only
        run: npx firebase-tools deploy --project eldalel-elshamel --only firestore:rules --non-interactive
      - name: Publish verified website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf 'https://github.com/'
          npx gh-pages -d build -m "Deploy registration rejection ${GITHUB_SHA}"
      - name: Remove release credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registration-release.json"
