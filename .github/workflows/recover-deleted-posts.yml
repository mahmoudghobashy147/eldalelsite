name: Recover Deleted Posts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_PROJECT_ID: eldalel-elshamel
      RECOVERY_READ_TIME: 2026-10-02T06:55:00Z

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Configure Firebase credentials
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          else
            echo "::error::Firebase service account secret is missing"
            exit 1
          fi
          node -e 'const f=require(process.argv[1]); if(f.project_id!=="eldalel-elshamel"||!f.private_key||!f.client_email) process.exit(1)' "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Restore missing posts from historical read time
        run: node functions/recover-deleted-posts.js

      - name: Cleanup Firebase credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
