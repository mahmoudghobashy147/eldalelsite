name: Repair Activated Member Auth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-member-auth.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Configure Firebase credentials
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          else
            echo "::error::Firebase service account secret missing"
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Safely canonicalize activated member Auth identities
        working-directory: functions
        run: |
          node - <<'NODE'
          const admin = require('firebase-admin');
          admin.initializeApp();
          const db = admin.firestore();
          const auth = admin.auth();

          const normalizePhone = (value) => {
            let d = String(value || '')
              .replace(/[٠-٩]/g, x => String('٠١٢٣٤٥٦٧٨٩'.indexOf(x)))
              .replace(/[۰-۹]/g, x => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(x)))
              .replace(/\D/g, '');
            if (d.startsWith('20') && d.length >= 12) d = '0' + d.slice(2);
            if (d.length === 10 && d.startsWith('1')) d = '0' + d;
            return d;
          };

          (async () => {
            const snap = await db.collection('members').where('status','==','approved').get();
            const members = snap.docs.map(d => ({ id:d.id, ...d.data() }));

            const authUsers = [];
            let token;
            do {
              const page = await auth.listUsers(1000, token);
              authUsers.push(...page.users);
              token = page.pageToken;
            } while (token);

            const byUid = new Map(authUsers.map(u => [u.uid, u]));
            const byEmail = new Map(authUsers.filter(u=>u.email).map(u => [u.email.toLowerCase(), u]));

            let checked=0, updated=0, alreadyOk=0, skippedAdmin=0, missingAuth=0, invalidPhone=0, collisions=0;
            const batch = db.batch();
            let batchWrites = 0;

            for (const m of members) {
              if (m.isAdmin === true) { skippedAdmin++; continue; }
              checked++;
              const phone = normalizePhone(m.phone);
              if (phone.length !== 11 || !phone.startsWith('01')) { invalidPhone++; continue; }

              const uid = String(m.uid || m.id || '');
              const user = byUid.get(uid);
              if (!user) { missingAuth++; continue; }

              const canonicalEmail = `${phone}@daleel.app`;
              const currentEmail = String(user.email || '').toLowerCase();
              if (currentEmail === canonicalEmail.toLowerCase()) {
                alreadyOk++;
              } else {
                const occupying = byEmail.get(canonicalEmail.toLowerCase());
                if (occupying && occupying.uid !== uid) {
                  collisions++;
                  continue;
                }
                await auth.updateUser(uid, { email: canonicalEmail });
                byEmail.delete(currentEmail);
                byEmail.set(canonicalEmail.toLowerCase(), { ...user, email: canonicalEmail });
                updated++;
              }

              if (m.phoneNormalized !== phone || m.uid !== uid) {
                batch.set(db.collection('members').doc(m.id), {
                  uid,
                  phoneNormalized: phone,
                  authCanonicalizedAt: admin.firestore.FieldValue.serverTimestamp(),
                }, { merge:true });
                batchWrites++;
              }
            }

            if (batchWrites) await batch.commit();

            console.log('REPAIR_CHECKED_NON_ADMIN_APPROVED=' + checked);
            console.log('REPAIR_UPDATED_AUTH_EMAIL=' + updated);
            console.log('REPAIR_ALREADY_OK=' + alreadyOk);
            console.log('REPAIR_SKIPPED_ADMIN=' + skippedAdmin);
            console.log('REPAIR_MISSING_AUTH=' + missingAuth);
            console.log('REPAIR_INVALID_PHONE=' + invalidPhone);
            console.log('REPAIR_EMAIL_COLLISIONS=' + collisions);
            console.log('REPAIR_MEMBER_METADATA_WRITES=' + batchWrites);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
