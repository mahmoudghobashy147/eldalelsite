name: Sync Functions package lock once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-lockfile-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Synchronize Functions lock metadata
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean locked Functions install
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Verify patched parser is resolved
        working-directory: functions
        run: npm ls fast-xml-parser

      - name: Commit Functions lockfile
        shell: bash
        run: |
          if git diff --quiet -- functions/package-lock.json; then
            echo "Functions lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/package-lock.json
          git commit -m "Sync Functions lock with patched parser"
          git push origin HEAD:main
