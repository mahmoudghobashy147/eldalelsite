name: Sync root package lock once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-lockfile-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean locked install
        run: npm ci --ignore-scripts

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync lock after dependency classification"
          git push origin HEAD:main
